<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procrastination Pet 🐸</title>
  <style>
    :root {
      --bg: #f8f5e9;
      --panel: #fffdf8;
      --card: #ffffff;
      --ink: #203b2b;
      --muted: #4b6150;
      --border: #dce5d8;
      --primary: #285c3b;
      --primary-dark: #19452b;
      --secondary: #e7eee3;
      --highlight: #d18a24;
      --success: #438655;
      --warning: #e1b55e;
      --danger: #c55b4d;
      --focus: #dff3d8;
      --break: #fff0cf;
      --shadow: rgba(33, 56, 34, 0.08);
    }

    :root[data-theme="dark"] {
      --bg: #181d1a;
      --panel: #1d2522;
      --card: #242f2b;
      --ink: #edf5ee;
      --muted: #b9c9bb;
      --border: #37463d;
      --primary: #8ad8a3;
      --primary-dark: #69c884;
      --secondary: #2b3b35;
      --highlight: #f0bb63;
      --success: #7ed39a;
      --warning: #e7cb6c;
      --danger: #ef8d7d;
      --focus: #203a28;
      --break: #413821;
      --shadow: rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      transition: background 0.2s ease, color 0.2s ease;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin: 20px 0 30px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      margin: 0 0 8px;
    }

    h2 {
      margin-top: 0;
    }

    p { line-height: 1.6; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 12px 34px var(--shadow);
    }

    .pet {
      background: linear-gradient(180deg, #ebf7e6 0%, #e4efd9 100%);
      text-align: center;
    }

    :root[data-theme="dark"] .pet {
      background: linear-gradient(180deg, #1b2d25 0%, #1f332b 100%);
    }

    .frog {
      font-size: 90px;
      margin: 12px 0;
      line-height: 1;
      display: inline-block;
      animation: floatFrog 2.2s ease-in-out infinite alternate;
    }

    @keyframes floatFrog {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-8px) rotate(2deg); }
    }

    .mood {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 8px 0;
    }

    .meta-label {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 8px;
    }

    .progress {
      height: 12px;
      background: #dce5d8;
      border-radius: 10px;
      overflow: hidden;
      margin: 12px 0;
    }

    :root[data-theme="dark"] .progress {
      background: #2f3d37;
    }

    #bar {
      height: 100%;
      width: 0;
      background: var(--success);
      transition: width 0.3s ease;
    }

    .small {
      font-size: 0.92rem;
      color: var(--muted);
    }

    input, button, select {
      font: inherit;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #b8c9b5;
      border-radius: 10px;
      margin: 8px 0;
      background: #ffffff;
      color: var(--ink);
    }

    :root[data-theme="dark"] input,
    :root[data-theme="dark"] select {
      background: #171f1b;
      border-color: #41564d;
      color: var(--ink);
    }

    button {
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 650;
      transition: filter 0.15s ease, transform 0.15s ease;
    }

    :root[data-theme="dark"] button {
      color: #102014;
    }

    button:hover {
      background: var(--primary-dark);
      filter: brightness(1.02);
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--highlight);
      outline-offset: 3px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary {
      background: var(--secondary);
      color: var(--ink);
    }

    .secondary:hover {
      background: #dae6d7;
    }

    :root[data-theme="dark"] .secondary:hover {
      background: #32463d;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 12px;
      font-size: 0.9rem;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--ink);
      font-weight: 700;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
    }

    :root[data-theme="dark"] .mode-btn.active {
      color: #0f1d16;
    }

    .task-form {
      display: grid;
      gap: 8px;
    }

    .task-form-row {
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 10px;
    }

    .task-form button {
      width: 100%;
      padding: 12px 14px;
      margin-top: 2px;
    }

    .task-list {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }

    .task {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px 12px;
      align-items: start;
      padding: 10px 8px 10px 0;
      border-bottom: 1px solid #edeae0;
      width: 100%;
    }

    :root[data-theme="dark"] .task {
      border-bottom-color: #2b3832;
    }

    .task.active {
      background: #f4fbf0;
      border-radius: 10px;
      padding-left: 10px;
      border-bottom-color: transparent;
    }

    :root[data-theme="dark"] .task.active {
      background: #1a2d23;
    }

    .task input[type="checkbox"] {
      width: auto;
      margin: 0;
      accent-color: var(--success);
      margin-top: 4px;
      flex-shrink: 0;
    }

    .task-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .task-text {
      font-weight: 600;
      line-height: 1.35;
      word-break: normal;
      overflow-wrap: normal;
      white-space: normal;
    }

    .task.done .task-text {
      text-decoration: line-through;
      opacity: 0.7;
    }

    .task-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .task-actions {
      grid-column: 2 / 3;
      display: flex;
      gap: 6px;
      justify-content: flex-start;
      flex-wrap: wrap;
      margin-top: 4px;
      padding-bottom: 4px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--secondary);
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .badge.low { background: #e5f0ff; color: #294f8e; }
    .badge.medium { background: #fff4da; color: #7a5a15; }
    .badge.high { background: #ffe3df; color: #8f3d32; }

    .mini-btn,
    .tiny-btn {
      padding: 7px 10px;
      font-size: 0.8rem;
      border-radius: 10px;
    }

    .tiny-btn {
      padding: 5px 7px;
      font-size: 0.72rem;
    }

    .timer-box {
      text-align: center;
      margin: 10px 0 16px;
    }

    .timer {
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      font-weight: 800;
      margin: 18px 0;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .button-row button {
      flex: 1;
      min-width: 110px;
      padding: 11px 14px;
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .task { grid-template-columns: auto 1fr; }
      .task-actions { grid-column: 2 / -1; display: flex; justify-content: flex-start; gap: 8px; }
      .task-form-row { grid-template-columns: 1fr; }
      .button-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .button-row button { min-width: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Study a little. Save your frog. 🐸</h1>
      <p>Your deadlines are crying. Your frog is counting on you.</p>
    </header>

    <div class="grid">
      <section class="card pet" aria-labelledby="pet-title">
        <h2 id="pet-title">Your study buddy</h2>
        <div class="frog" id="frog" role="img" aria-label="Happy frog">🐸</div>
        <p class="mood" id="mood" aria-live="polite">Ready to conquer the day!</p>
        <div id="level">Level 1 · Frog beginner</div>
        <p><strong><span id="xp">0</span> XP</strong></p>
        <div class="progress" role="progressbar" aria-label="Progress to next level" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0" id="xpProgress">
          <div id="bar"></div>
        </div>
        <p class="small" id="reward">Complete tasks to earn rewards!</p>
      </section>

      <section class="card" aria-labelledby="tasks-title">
        <h2 id="tasks-title">Your missions 📚</h2>
        <form id="taskForm" class="task-form">
          <label for="taskInput">What do you need to do?</label>
          <div class="task-form-row">
            <input id="taskInput" maxlength="100" placeholder="e.g. Study statistics" required>
            <select id="taskDuration" aria-label="Task duration">
              <option value="15">15 min</option>
              <option value="25" selected>25 min</option>
              <option value="35">35 min</option>
              <option value="50">50 min</option>
            </select>
          </div>
          <select id="taskPriority" aria-label="Task priority">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
          </select>
          <button type="submit">+ Add mission</button>
        </form>
        <p id="taskSummary" class="small" aria-live="polite">No missions yet. Let's start!</p>
        <div id="tasks" class="task-list"></div>
      </section>

      <section class="card" aria-labelledby="timer-title">
        <h2 id="timer-title">Focus zone ⏳</h2>
        <div class="timer-box">
          <div class="timer" id="timer" role="timer" aria-live="polite" aria-label="25 minutes remaining">25:00</div>
        </div>
        <div class="button-row">
          <button id="start">Start</button>
          <button id="pause" class="secondary">Pause</button>
          <button id="reset" class="secondary">Reset</button>
        </div>
        <p id="timerMessage" aria-live="polite" class="small">Ready when you are.</p>
      </section>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    const state = {
      xp: 0,
      tasks: [],
      currentTaskId: null,
      timer: 25 * 60,
      timerId: null
    };

    function saveState() {
      localStorage.setItem('frogSave', JSON.stringify(state));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem('frogSave') || '{}');
        if (Array.isArray(saved.tasks)) state.tasks = saved.tasks;
        if (typeof saved.xp === 'number') state.xp = saved.xp;
        if (saved.currentTaskId) state.currentTaskId = saved.currentTaskId;
      } catch (err) {
        console.warn('Could not restore saved work:', err);
      }
    }

    function renderTasks() {
      const tasksEl = $('tasks');
      tasksEl.innerHTML = '';

      if (!state.tasks.length) {
        $('taskSummary').textContent = 'No missions yet. Let\'s start!';
        return;
      }

      let doneCount = 0;

      state.tasks.forEach((task, index) => {
        const row = document.createElement('div');
        row.className = 'task' + (task.done ? ' done' : '') + (state.currentTaskId === task.id ? ' active' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = Boolean(task.done);
        checkbox.setAttribute('aria-label', 'Mark ' + task.text + ' complete');
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          if (task.done) state.xp += 10;
          else state.xp = Math.max(0, state.xp - 10);
          saveState();
          renderAll();
        });

        const main = document.createElement('div');
        main.className = 'task-main';

        const metaRow = document.createElement('div');
        metaRow.className = 'task-meta';
        metaRow.innerHTML = `<span>#${index + 1}</span><span>${Number(task.duration) || 25} min</span><span class="badge ${task.priority || 'medium'}">${task.priority || 'medium'}</span>`;

        const text = document.createElement('div');
        text.className = 'task-text';
        text.textContent = task.text;

        const status = document.createElement('div');
        status.className = 'task-meta';
        status.textContent = task.done ? 'Completed' : 'Ready';

        main.append(metaRow, text, status);

        const actions = document.createElement('div');
        actions.className = 'task-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'tiny-btn secondary';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => {
          const next = prompt('Edit mission', task.text);
          if (next && next.trim()) {
            task.text = next.trim();
            saveState();
            renderAll();
          }
        });

        const useBtn = document.createElement('button');
        useBtn.type = 'button';
        useBtn.className = 'tiny-btn secondary';
        useBtn.textContent = 'Use task';
        useBtn.addEventListener('click', () => {
          state.currentTaskId = task.id;
          $('timerMessage').textContent = `Using “${task.text}” for your next focus session.`;
          saveState();
          renderTasks();
        });

        const upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.className = 'tiny-btn secondary';
        upBtn.textContent = '↑';
        upBtn.title = 'Move up';
        upBtn.addEventListener('click', () => {
          if (index === 0) return;
          [state.tasks[index - 1], state.tasks[index]] = [state.tasks[index], state.tasks[index - 1]];
          saveState();
          renderTasks();
        });

        const downBtn = document.createElement('button');
        downBtn.type = 'button';
        downBtn.className = 'tiny-btn secondary';
        downBtn.textContent = '↓';
        downBtn.title = 'Move down';
        downBtn.addEventListener('click', () => {
          if (index === state.tasks.length - 1) return;
          [state.tasks[index], state.tasks[index + 1]] = [state.tasks[index + 1], state.tasks[index]];
          saveState();
          renderTasks();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'tiny-btn secondary';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => {
          state.tasks = state.tasks.filter(item => item.id !== task.id);
          if (state.currentTaskId === task.id) state.currentTaskId = null;
          saveState();
          renderAll();
        });

        actions.append(editBtn, useBtn, upBtn, downBtn, deleteBtn);
        row.append(checkbox, main, actions);
        tasksEl.appendChild(row);

        if (task.done) doneCount++;
      });

      $('taskSummary').textContent = `${doneCount} of ${state.tasks.length} missions completed`;
      if (state.currentTaskId) {
        const active = state.tasks.find(task => task.id === state.currentTaskId);
        if (active) $('timerMessage').textContent = `Active task: ${active.text}`;
      }
    }

    function renderStats() {
      const level = Math.floor(state.xp / 50) + 1;
      const progress = state.xp % 50;
      $('xp').textContent = String(state.xp);
      $('level').textContent = `Level ${level} · ${['Frog beginner', 'Study tadpole', 'Academic amphibian', 'Legendary frog'][Math.min(level - 1, 3)]}`;
      $('bar').style.width = `${(progress / 50) * 100}%`;
      $('xpProgress').setAttribute('aria-valuenow', String(progress));
      $('reward').textContent = level >= 2 ? '🎩 Your frog earned a tiny graduation hat!' : `${50 - progress} XP until your first reward!`;
      $('frog').textContent = state.tasks.some(task => task.done) ? '🐸' : '🐸';
    }

    function renderAll() {
      renderTasks();
      renderStats();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(state.timer / 60);
      const secs = state.timer % 60;
      $('timer').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      $('timer').setAttribute('aria-label', `${mins} minutes and ${secs} seconds remaining`);
    }

    function startTimer() {
      if (state.timerId) return;
      state.timerId = setInterval(() => {
        state.timer -= 1;
        updateTimerDisplay();
        if (state.timer <= 0) {
          clearInterval(state.timerId);
          state.timerId = null;
          $('timerMessage').textContent = 'Session complete! Take a little break. 🎉';
          state.xp += 20;
          saveState();
          renderStats();
          state.timer = 25 * 60;
          updateTimerDisplay();
        }
      }, 1000);
    }

    function pauseTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      $('timerMessage').textContent = 'Paused. Take your time.';
    }

    function resetTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      state.timer = 25 * 60;
      updateTimerDisplay();
      $('timerMessage').textContent = 'Timer reset. Ready when you are.';
    }

    $('taskForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = $('taskInput');
      const text = input.value.trim();
      if (!text) return;

      state.tasks.push({
        id: (Date.now() + Math.random()).toString(),
        text,
        duration: Number($('taskDuration').value) || 25,
        priority: ['low', 'medium', 'high'].includes($('taskPriority').value) ? $('taskPriority').value : 'medium',
        done: false
      });

      input.value = '';
      input.focus();
      saveState();
      renderAll();
    });

    $('start').addEventListener('click', startTimer);
    $('pause').addEventListener('click', pauseTimer);
    $('reset').addEventListener('click', resetTimer);

    loadState();
    updateTimerDisplay();
    renderAll();
  </script>
</body>
</html>
