<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procrastination Pet</title>
    <style>
      :root {
        --bg: #f6f8ff;
        --panel: #ffffff;
        --panel-alt: #eef6ff;
        --ink: #1f2d3d;
        --muted: #586a7d;
        --border: rgba(25, 55, 86, 0.12);
        --shadow: 0 18px 35px rgba(30, 62, 100, 0.12);
        --primary: #65d3c6;
        --primary-strong: #2eb7a8;
        --secondary: #ffb47d;
        --secondary-strong: #ff8b54;
        --accent: #8f8dff;
        --success: #7ad7a4;
        --danger: #ef6e7c;
        --warning: #ffd76d;
        --pet-shell: #dff8ef;
        --pet-shell-strong: #bdeee1;
        --pet-ink: #1f2d3d;
        --progress-bg: #e5eef8;
        --progress-fill: linear-gradient(90deg, #65d3c6, #7bb6ff);
        --focus-bg: linear-gradient(135deg, #f4f2ff, #eefaf8);
        --focus-ink: #163d4f;
        --radius-lg: 28px;
        --radius-md: 18px;
        --radius-sm: 12px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(139, 148, 255, 0.2), transparent 30%),
          radial-gradient(circle at bottom right, rgba(101, 211, 198, 0.18), transparent 28%),
          var(--bg);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
        white-space: nowrap;
      }

      .app-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        box-shadow: 0 10px 25px rgba(118, 102, 255, 0.25);
        font-size: 1.5rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 1.06fr) minmax(300px, 1.2fr) minmax(240px, 0.78fr);
        gap: 20px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }

      .pet-panel,
      .task-panel,
      .timer-panel {
        padding: 22px;
      }

      .panel-title {
        margin: 0 0 18px;
        font-size: clamp(1.2rem, 2vw, 1.5rem);
        line-height: 1.2;
      }

      .pet-card {
        background: linear-gradient(180deg, rgba(242, 250, 255, 0.9), rgba(255,255,255,0.85));
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 16px;
      }

      .pet-scene {
        position: relative;
        min-height: 300px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f0fbff 0%, #edf8ff 38%, #eaf9f2 100%);
        border-radius: 16px;
        border: 1px solid rgba(38, 74, 115, 0.08);
        overflow: hidden;
      }

      .pet-scene::before,
      .pet-scene::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        opacity: 0.7;
      }

      .pet-scene::before {
        width: 180px;
        height: 180px;
        background: rgba(87, 196, 167, 0.15);
        right: -40px;
        top: 18px;
      }

      .pet-scene::after {
        width: 160px;
        height: 160px;
        background: rgba(149, 144, 255, 0.12);
        left: -25px;
        bottom: 15px;
      }

      .pet-sprite {
        position: relative;
        z-index: 1;
        width: min(250px, 72vw);
        height: min(250px, 72vw);
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(219, 242, 255, 0.93));
        border: 1px solid rgba(24, 58, 92, 0.09);
        box-shadow: inset 0 5px 12px rgba(255,255,255,0.7), 0 16px 28px rgba(65, 104, 131, 0.12);
        transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      }

      .pet-sprite[data-stage="tiny-tadpole"] {
        background: linear-gradient(135deg, rgba(214, 241, 255, 0.95), rgba(193, 247, 232, 0.88));
      }

      .pet-sprite[data-stage="growing-tadpole"] {
        background: linear-gradient(135deg, rgba(220, 245, 227, 0.95), rgba(194, 235, 255, 0.9));
      }

      .pet-sprite[data-stage="froglet"] {
        background: linear-gradient(135deg, rgba(208, 255, 233, 0.95), rgba(247, 214, 255, 0.9));
      }

      .pet-sprite[data-stage="academic-frog"] {
        background: linear-gradient(135deg, rgba(223, 239, 255, 0.96), rgba(255, 231, 183, 0.85));
      }

      .pet-sprite[data-stage="legendary-frog"] {
        background: linear-gradient(135deg, rgba(255, 245, 194, 0.96), rgba(239, 224, 255, 0.9));
      }

      .pet-sprite:hover {
        transform: translateY(-3px);
      }

      .pet-emoji {
        position: relative;
        z-index: 2;
        font-size: clamp(5rem, 12vw, 8rem);
        filter: drop-shadow(0 12px 10px rgba(74, 97, 116, 0.08));

      .pet-accessory {

        bottom: 22%;

        margin-top: 18px;

      .task-panel {

      }

        display: flex;

        border: none;

      .task-list {
        list-style: none;

        padding: 0;
        display: flex;
        flex-direction: column;

      }

      .task-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;

      .task-item:hover {
        transform: translateY(-1px);

        text-decoration: line-through;

        appearance: none;

      .timer-controls {

      .timer-button {
        border: none;
        border-radius: 12px;

      .timer-button.secondary {

      .task-submit:focus-visible,

      }

        border: 1px dashed rgba(61, 87, 124, 0.2);

        text-align: center;
      }

      @media (max-width: 940px) {

      @media (max-width: 640px) {

          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .pet-meta {
          grid-template-columns: 1fr;
        }

        .task-form {
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,

        *::after {

          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Main header">
        <div class="brand" aria-label="Procrastination Pet">
          <span class="brand-mark" aria-hidden="true">🐸</span>
          <span>Procrastination Pet</span>
        </div>
      </header>

      <main class="layout" aria-label="Pet and tasks dashboard">
        <section class="panel pet-panel" aria-labelledby="pet-panel-title">
          <h2 id="pet-panel-title" class="panel-title">Your Froggy Friend</h2>

          <div class="pet-card">
            <div class="pet-scene" aria-live="polite">
              <div id="pet-sprite" class="pet-sprite" data-stage="tiny-tadpole" aria-label="Pet frog evolution stage">
                <div id="pet-bubble" class="pet-bubble" aria-hidden="true">✨</div>
                <div id="pet-emoji" class="pet-emoji" aria-hidden="true">🐸</div>
                <div id="pet-accessory" class="pet-accessory" aria-hidden="true">🫧</div>
              </div>
            </div>

            <div class="pet-meta" aria-label="Pet status details">
              <div class="pet-stat">
                <span class="pet-stat-label">Stage</span>
                <span id="stage-name" class="pet-stat-value">Tiny Tadpole</span>
              </div>
              <div class="pet-stat">
                <span class="pet-stat-label">Level</span>
                <span id="level-display" class="pet-stat-value">1</span>
              </div>
              <div class="pet-stat">
                <span class="pet-stat-label">XP</span>
                <span id="xp-display" class="pet-stat-value">0 XP</span>
              </div>
            </div>

            <div class="progress-wrap" aria-label="Progress to next evolution">
              <div class="progress-head">
                <span id="progress-label">0% to Growing Tadpole</span>
                <span id="next-stage-label">Next: Growing Tadpole</span>
              </div>
              <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progress-label">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
            </div>

            <div id="evolution-message" class="evolution-message" aria-live="polite" aria-atomic="true"></div>
          </div>
        </section>

        <section class="panel task-panel" aria-labelledby="tasks-panel-title">
          <h2 id="tasks-panel-title" class="panel-title">Task Quest Log</h2>

          <form id="task-form" class="task-form" novalidate>
            <label class="sr-only" for="task-input">Add a task</label>
            <input id="task-input" class="task-input" type="text" maxlength="140" placeholder="Add a tiny task..." aria-label="Add a task" />
            <button id="task-submit" class="task-submit" type="submit">Add</button>
          </form>

          <ul id="task-list" class="task-list" aria-live="polite" aria-label="Task list"></ul>
        </section>

        <aside class="panel timer-panel" aria-labelledby="timer-panel-title">
          <h2 id="timer-panel-title" class="panel-title">Focus Timer</h2>

          <div id="timer-display" class="timer-display" aria-live="polite">25:00</div>

          <div class="timer-controls">
            <button id="start-timer" class="timer-button primary" type="button">Start</button>
            <button id="pause-timer" class="timer-button secondary" type="button">Pause</button>
            <button id="reset-timer" class="timer-button" type="button">Reset</button>
          </div>
        </aside>
      </main>
    </div>

    <script>
      (function () {
        "use strict";

        const STORAGE_KEY = "procrastinationPetStateV1";
        const EVOLUTION_STAGES = [
          { key: "tiny-tadpole", name: "Tiny Tadpole", min: 0, max: 49, emoji: "🐸", accessory: "🫧", bubble: "💧" },
          { key: "growing-tadpole", name: "Growing Tadpole", min: 50, max: 99, emoji: "🐸", accessory: "🌿", bubble: "🌱" },
          { key: "froglet", name: "Froglet", min: 100, max: 199, emoji: "🐸", accessory: "🦋", bubble: "✨" },
          { key: "academic-frog", name: "Academic Frog", min: 200, max: 349, emoji: "🐸", accessory: "📚", bubble: "📘" },
          { key: "legendary-frog", name: "Legendary Frog", min: 350, max: Infinity, emoji: "🐸", accessory: "👑", bubble: "🌟" }
        ];

        const defaultState = {
          xp: 0,
          tasks: [],
        };

        const timerState = {
          durationSeconds: 25 * 60,
          remainingSeconds: 25 * 60,
          intervalId: null,
          running: false,
        };

        const petSpriteEl = document.getElementById("pet-sprite");
        const petEmojiEl = document.getElementById("pet-emoji");
        const petAccessoryEl = document.getElementById("pet-accessory");
        const petBubbleEl = document.getElementById("pet-bubble");
        const stageNameEl = document.getElementById("stage-name");
        const levelDisplayEl = document.getElementById("level-display");
        const xpDisplayEl = document.getElementById("xp-display");
        const progressLabelEl = document.getElementById("progress-label");
        const nextStageLabelEl = document.getElementById("next-stage-label");
        const progressFillEl = document.getElementById("progress-fill");
        const progressBarEl = document.getElementById("progress-bar-fill");
        const evolutionMessageEl = document.getElementById("evolution-message");
        const taskFormEl = document.getElementById("task-form");
        const taskInputEl = document.getElementById("task-input");
        const taskListEl = document.getElementById("task-list");
        const timerDisplayEl = document.getElementById("timer-display");

        let state = loadState();
        let lastStageIndex = getStageIndex(state.xp);

        function safeParseJSON(rawValue) {
          try {
            return JSON.parse(rawValue);
          } catch (_error) {
            return null;
          }
        }

        function loadState() {
          const raw = safeParseJSON(localStorage.getItem(STORAGE_KEY) || "null");
          const parsed = raw && typeof raw === "object" ? raw : {};
          const tasks = Array.isArray(parsed.tasks) ? parsed.tasks : [];
          const xp = Number.isFinite(Number(parsed.xp)) ? Math.max(0, Number(parsed.xp)) : 0;

          return {
            xp,
            tasks: tasks.map((task) => {
              const safeTask = {
                id: task && task.id ? String(task.id) : createId(),
                text: task && typeof task.text === "string" ? task.text : "Untitled task",
                completed: Boolean(task && task.completed),
                xpAwarded: Boolean(task && task.xpAwarded),
              };

              if (safeTask.completed && !Object.prototype.hasOwnProperty.call(task || {}, "xpAwarded")) {
                safeTask.xpAwarded = true;
              }

              return safeTask;
            }),
          };
        }

        function saveState() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              xp: state.xp,
              tasks: state.tasks,
            }));
          } catch (_error) {
            // Ignore storage issues.
          }
        }

        function createId() {
          if (window.crypto && typeof window.crypto.randomUUID === "function") {
            return window.crypto.randomUUID();
          }
          return "task-" + Date.now() + "-" + Math.random().toString(16).slice(2);
        }

        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        function getStageIndex(xp) {
          let index = 0;
          for (let i = 0; i < EVOLUTION_STAGES.length; i += 1) {
            if (xp >= EVOLUTION_STAGES[i].min && xp <= EVOLUTION_STAGES[i].max) {
              index = i;
              break;
            }
          }
          if (xp >= EVOLUTION_STAGES[EVOLUTION_STAGES.length - 1].min) {
            return EVOLUTION_STAGES.length - 1;
          }
          return index;
        }

        function getStageMeta(xp) {
          const stageIndex = getStageIndex(xp);
          const currentStage = EVOLUTION_STAGES[stageIndex];
          const nextStage = stageIndex < EVOLUTION_STAGES.length - 1 ? EVOLUTION_STAGES[stageIndex + 1] : null;

          if (!nextStage) {
            return {
              currentStage,
              nextStage: null,
              progressPercent: 100,
              remainingXp: 0,
              stageIndex,
              level: stageIndex + 1,
            };
          }

          const range = Math.max(1, nextStage.min - currentStage.min);
          const progressPercent = clamp(((xp - currentStage.min) / range) * 100, 0, 100);
          const remainingXp = Math.max(0, nextStage.min - xp);

          return {
            currentStage,
            nextStage,
            progressPercent,
            remainingXp,
            stageIndex,
            level: stageIndex + 1,
          };
        }

        function renderPet() {
          const { currentStage, nextStage, progressPercent, remainingXp, stageIndex, level } = getStageMeta(state.xp);

          petSpriteEl.dataset.stage = currentStage.key;
          petEmojiEl.textContent = currentStage.emoji;
          petAccessoryEl.textContent = currentStage.accessory;
          petBubbleEl.textContent = currentStage.bubble;

          stageNameEl.textContent = currentStage.name;
          levelDisplayEl.textContent = String(level);
          xpDisplayEl.textContent = `${state.xp} XP`;

          if (nextStage) {
            progressLabelEl.textContent = `${Math.round(progressPercent)}% to ${nextStage.name}`;
            nextStageLabelEl.textContent = `Next: ${nextStage.name}`;
            const remainingText = remainingXp > 0 ? `${remainingXp} XP to ${nextStage.name}` : `Ready for ${nextStage.name}`;
            nextStageLabelEl.title = remainingText;
          } else {
            progressLabelEl.textContent = "Max evolution reached";
            nextStageLabelEl.textContent = "Legendary Frog";
            nextStageLabelEl.title = "Final form";
          }

          progressFillEl.style.width = `${Math.round(progressPercent)}%`;
          progressBarEl.setAttribute("aria-valuenow", String(Math.round(progressPercent)));
          progressBarEl.setAttribute("aria-valuetext", `${Math.round(progressPercent)}%`);

          if (stageIndex === EVOLUTION_STAGES.length - 1) {
            progressFillEl.style.width = "100%";
          }
        }

        function showEvolutionMessage(messageText) {
          evolutionMessageEl.textContent = messageText;
          evolutionMessageEl.classList.add("visible");
        }

        function hideEvolutionMessage() {
          evolutionMessageEl.textContent = "";
          evolutionMessageEl.classList.remove("visible");
        }

        function awardXp(amount) {
          if (amount <= 0) {
            return;
          }

          const previousXp = state.xp;
          const previousStageIndex = getStageIndex(previousXp);
          state.xp = Math.max(0, previousXp + amount);
          saveState();
          renderPet();

          const newStageIndex = getStageIndex(state.xp);

          if (newStageIndex > previousStageIndex) {
            const previousStage = EVOLUTION_STAGES[previousStageIndex];
            const newStage = EVOLUTION_STAGES[newStageIndex];
            showEvolutionMessage(`Your ${previousStage.name} evolved into a ${newStage.name}!`);
          }
        }

        function renderTasks() {
          if (!Array.isArray(state.tasks) || state.tasks.length === 0) {
            taskListEl.innerHTML = `
              <li class="task-empty-state" aria-live="polite">
                No tasks yet. Add one to help your frog grow!
              </li>
            `;
            return;
          }

          taskListEl.innerHTML = state.tasks
            .map((task) => {
              const doneClass = task.completed ? "done" : "";
              const checkedAttr = task.completed ? "checked" : "";
              return `
                <li class="task-item ${doneClass}" data-task-id="${task.id}">
                  <input
                    id="task-${task.id}"
                    type="checkbox"
                    ${checkedAttr}
                    aria-label="Mark task complete: ${escapeHtml(task.text)}"
                  />
                  <label class="task-label" for="task-${task.id}">${escapeHtml(task.text)}</label>
                  <button class="task-delete" type="button" aria-label="Delete task: ${escapeHtml(task.text)}" data-action="delete" data-task-id="${task.id}">
                    ×
                  </button>
                </li>
              `;
            })
            .join("");
        }

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function handleTaskSubmit(event) {
          event.preventDefault();

          const value = taskInputEl.value.trim();

          if (!value) {
            taskInputEl.focus();
            return;
          }

          state.tasks.unshift({
            id: createId(),
            text: value,
            completed: false,
            xpAwarded: false,
          });

          saveState();
          renderTasks();
          taskInputEl.value = "";
          taskInputEl.focus();
        }

        function handleTaskListChange(event) {
          const checkbox = event.target.closest('input[type="checkbox"]');
          if (!checkbox) {
            return;
          }

          const taskId = checkbox.closest(".task-item")?.dataset.taskId;
          if (!taskId) {
            return;
          }

          const task = state.tasks.find((item) => item.id === taskId);
          if (!task) {
            return;
          }

          const wasCompleted = Boolean(task.completed);
          const shouldBeCompleted = checkbox.checked;

          if (shouldBeCompleted && !wasCompleted) {
            task.completed = true;
            if (!task.xpAwarded) {
              task.xpAwarded = true;
              awardXp(10);
            }
          } else if (!shouldBeCompleted && wasCompleted) {
            task.completed = false;
          }

          saveState();
          renderTasks();
          renderPet();
        }

        function handleTaskListClick(event) {
          const deleteButton = event.target.closest("[data-action='delete']");
          if (!deleteButton) {
            return;
          }

          const taskId = deleteButton.dataset.taskId;
          state.tasks = state.tasks.filter((task) => task.id !== taskId);
          saveState();
          renderTasks();
        }

        function updateTimerDisplay() {
          const minutes = Math.floor(timerState.remainingSeconds / 60);
          const seconds = timerState.remainingSeconds % 60;
          timerDisplayEl.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        }

        function stopTimer() {
          timerState.running = false;

          if (timerState.intervalId) {
            clearInterval(timerState.intervalId);
            timerState.intervalId = null;
          }
        }

        function startTimer() {
          if (timerState.running) {
            return;
          }

          timerState.running = true;
          timerState.intervalId = setInterval(() => {
            if (timerState.remainingSeconds > 0) {
              timerState.remainingSeconds -= 1;
              updateTimerDisplay();
            } else {
              stopTimer();
            }
          }, 1000);
        }

        function pauseTimer() {
          stopTimer();
        }

        function resetTimer() {
          stopTimer();
          timerState.remainingSeconds = timerState.durationSeconds;
          updateTimerDisplay();
        }

        function initializeTimer() {
          updateTimerDisplay();
        }

        function initializeApp() {
          renderTasks();
          renderPet();
          initializeTimer();

          taskFormEl.addEventListener("submit", handleTaskSubmit);
          taskListEl.addEventListener("change", handleTaskListChange);
          taskListEl.addEventListener("click", handleTaskListClick);

          document.getElementById("start-timer").addEventListener("click", startTimer);
          document.getElementById("pause-timer").addEventListener("click", pauseTimer);
          document.getElementById("reset-timer").addEventListener("click", resetTimer);

          // Ensure no message replays on page refresh. We only trigger on actual XP crossing.
          lastStageIndex = getStageIndex(state.xp);
        }

        initializeApp();
      })();
    </script>
  </body>
</html>
