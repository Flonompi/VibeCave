<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Procrastination Pet 🐸</title>
  <style>
    :root {
      --bg: #f8f5e9;
      --panel: #fffdf8;
      --card: #ffffff;
      --ink: #203b2b;
      --muted: #4b6150;
      --border: #dce5d8;
      --primary: #285c3b;
      --primary-dark: #19452b;
      --secondary: #e7eee3;
      --highlight: #d18a24;
      --success: #438655;
      --warning: #e1b55e;
      --danger: #c55b4d;
      --focus: #dff3d8;
      --shadow: rgba(33, 56, 34, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      padding: 24px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin: 20px 0 30px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin: 0 0 8px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    p { line-height: 1.6; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 12px 34px var(--shadow);
    }

    .pet {
      background: linear-gradient(180deg, #ebf7e6 0%, #e4efd9 100%);
      text-align: center;
    }

    .frog {
      font-size: 90px;
      margin: 12px 0;
      line-height: 1;
      display: inline-block;
      animation: floatFrog 2.2s ease-in-out infinite alternate;
    }

    @keyframes floatFrog {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-8px) rotate(2deg); }
    }

    .mood {
      margin: 10px 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .progress {
      height: 12px;
      background: #dce5d8;
      border-radius: 10px;
      overflow: hidden;
      margin: 12px 0;
    }

    #bar {
      height: 100%;
      width: 0;
      background: var(--success);
      transition: width 0.25s ease;
    }

    .small {
      font-size: 0.92rem;
      color: var(--muted);
    }

    .task-form {
      display: grid;
      gap: 8px;
    }

    .task-form-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 130px;
      gap: 10px;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #b8c9b5;
      border-radius: 10px;
      margin: 8px 0;
      background: #fff;
      color: var(--ink);
    }

    button {
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 650;
      transition: filter 0.15s ease, transform 0.15s ease;
    }

    button:hover { filter: brightness(1.02); }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--highlight);
      outline-offset: 3px;
    }

    .secondary {
      background: var(--secondary);
      color: var(--ink);
    }

    .secondary:hover {
      background: #dae6d7;
    }

    .danger {
      background: #f8e2df;
      color: #7d342d;
    }

    .danger:hover {
      background: #f1d5d0;
    }

    .task-form button {
      width: 100%;
      padding: 12px 14px;
      margin-top: 2px;
    }

    .task-list {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }

    .task {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      min-height: 78px;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .task:hover {
      border-color: #bfd0bf;
    }

    .task.active {
      background: #f4fbf0;
      border-color: #cfe6c5;
    }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--success);
      flex-shrink: 0;
    }

    .task-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .task-text {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .task.done .task-text {
      text-decoration: line-through;
      opacity: 0.7;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--ink);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge.low { background: #e5f0ff; color: #294f8e; }
    .badge.medium { background: #fff4da; color: #7a5a15; }
    .badge.high { background: #ffe3df; color: #8f3d32; }

    .task-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .mini-btn,
    .tiny-btn {
      padding: 7px 10px;
      font-size: 0.76rem;
      border-radius: 10px;
      line-height: 1;
      white-space: nowrap;
    }

    .tiny-btn {
      padding: 6px 8px;
      font-size: 0.72rem;
    }

    .timer-box { text-align: center; margin: 12px 0 18px; }
    .timer {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      margin: 18px 0;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 640px) {
      body { padding: 14px; }
      .task-form-row { grid-template-columns: 1fr; }
      .task {
        grid-template-columns: auto minmax(0, 1fr);
      }
      .task-actions {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }
      .task-top { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Study a little. Save your frog. 🐸</h1>
      <p>Your deadlines are crying. Your frog is counting on you.</p>
    </header>

    <div class="grid">
      <section class="card pet" aria-labelledby="pet-title">
        <h2 id="pet-title">Your study buddy</h2>
        <div class="frog" id="frog" role="img" aria-label="Happy frog">🐸</div>
        <p class="mood" id="mood">Ready to conquer the day!</p>
        <div id="level">Level 1 · Frog beginner</div>
        <p><strong><span id="xp">0</span> XP</strong></p>
        <div class="progress" role="progressbar" aria-label="Progress to next level" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0" id="xpProgress">
          <div id="bar"></div>
        </div>
        <p class="small" id="reward">Complete tasks to earn rewards!</p>
      </section>

      <section class="card" aria-labelledby="tasks-title">
        <h2 id="tasks-title">Your missions 📚</h2>

        <form id="taskForm" class="task-form">
          <label for="taskInput">What do you need to do?</label>
          <div class="task-form-row">
            <input id="taskInput" maxlength="100" placeholder="e.g. Study statistics" required />
            <select id="taskDuration" aria-label="Task duration">
              <option value="15">15 min</option>
              <option value="25" selected>25 min</option>
              <option value="35">35 min</option>
              <option value="50">50 min</option>
            </select>
          </div>

          <select id="taskPriority" aria-label="Task priority">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
          </select>

          <button type="submit">+ Add mission</button>
        </form>

        <p id="taskSummary" class="small" aria-live="polite">No missions yet. Let's start!</p>
        <div id="tasks" class="task-list" aria-live="polite"></div>
      </section>

      <section class="card" aria-labelledby="timer-title">
        <h2 id="timer-title">Focus zone ⏳</h2>
        <div class="timer-box">
          <div class="timer" id="timer" role="timer" aria-label="25 minutes remaining">25:00</div>
        </div>
        <div class="task-form-row" style="margin-bottom: 10px;">
          <button id="start">Start</button>
          <button id="pause" class="secondary">Pause</button>
        </div>
        <div class="task-form-row">
          <button id="reset" class="secondary">Reset</button>
          <button id="switchTask" class="secondary">Use task</button>
        </div>
        <p id="timerMessage" aria-live="polite" class="small">Ready when you are.</p>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const state = {
      xp: 0,
      tasks: [],
      activeTaskId: null,
      timer: 25 * 60,
      timerId: null,
      selectedDuration: 25
    };

    function saveState() {
      localStorage.setItem('frogSave', JSON.stringify(state));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem('frogSave') || '{}');
        if (Array.isArray(saved.tasks)) state.tasks = saved.tasks;
        if (typeof saved.xp === 'number') state.xp = saved.xp;
        if (saved.activeTaskId) state.activeTaskId = saved.activeTaskId;
      } catch (err) {
        console.warn('Could not restore saved work:', err);
      }
    }

    function formatPriority(value) {
      return ['low', 'medium', 'high'].includes(value) ? value : 'medium';
    }

    function getTaskById(id) {
      return state.tasks.find(task => task.id === id) || null;
    }

    function renderTasks() {
      const tasksEl = $('tasks');
      tasksEl.innerHTML = '';

      if (!state.tasks.length) {
        $('taskSummary').textContent = 'No missions yet. Let\'s start!';
        return;
      }

      let doneCount = 0;

      state.tasks.forEach((task, index) => {
        const row = document.createElement('div');
        row.className = 'task' + (task.done ? ' done' : '') + (state.activeTaskId === task.id ? ' active' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = Boolean(task.done);
        checkbox.setAttribute('aria-label', `Mark ${task.text} complete`);
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          if (task.done) {
            state.xp += 10;
            if (state.activeTaskId === task.id) {
              state.activeTaskId = null;
            }
          } else {
            state.xp = Math.max(0, state.xp - 10);
          }
          saveState();
          renderAll();
        });

        const main = document.createElement('div');
        main.className = 'task-main';

        const top = document.createElement('div');
        top.className = 'task-top';
        top.innerHTML = `<span>#${index + 1}</span><span>${Number(task.duration) || 25} min</span><span class="badge ${task.priority || 'medium'}">${task.priority || 'medium'}</span>`;

        const text = document.createElement('div');
        text.className = 'task-text';
        text.textContent = task.text;

        const meta = document.createElement('div');
        meta.className = 'task-meta';
        meta.innerHTML = task.done ? '<span class="small">Completed</span>' : '<span class="small">Ready</span>';

        main.append(top, text, meta);

        const actions = document.createElement('div');
        actions.className = 'task-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'tiny-btn secondary';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => {
          const next = prompt('Edit mission', task.text);
          if (next && next.trim()) {
            task.text = next.trim();
            saveState();
            renderAll();
          }
        });

        const useBtn = document.createElement('button');
        useBtn.type = 'button';
        useBtn.className = 'tiny-btn secondary';
        useBtn.textContent = 'Use task';
        useBtn.addEventListener('click', () => {
          state.activeTaskId = task.id;
          $('timerMessage').textContent = `Using “${task.text}” for your next focus session.`;
          saveState();
          renderTasks();
        });

        const upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.className = 'tiny-btn secondary';
        upBtn.textContent = '↑';
        upBtn.setAttribute('aria-label', 'Move task up');
        upBtn.addEventListener('click', () => {
          if (index === 0) return;
          [state.tasks[index - 1], state.tasks[index]] = [state.tasks[index], state.tasks[index - 1]];
          saveState();
          renderTasks();
        });

        const downBtn = document.createElement('button');
        downBtn.type = 'button';
        downBtn.className = 'tiny-btn secondary';
        downBtn.textContent = '↓';
        downBtn.setAttribute('aria-label', 'Move task down');
        downBtn.addEventListener('click', () => {
          if (index === state.tasks.length - 1) return;
          [state.tasks[index], state.tasks[index + 1]] = [state.tasks[index + 1], state.tasks[index]];
          saveState();
          renderTasks();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'tiny-btn danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => {
          state.tasks = state.tasks.filter(item => item.id !== task.id);
          if (state.activeTaskId === task.id) state.activeTaskId = null;
          saveState();
          renderAll();
        });

        actions.append(editBtn, useBtn, upBtn, downBtn, deleteBtn);
        row.append(checkbox, main, actions);
        tasksEl.appendChild(row);

        if (task.done) doneCount += 1;
      });

      $('taskSummary').textContent = `${doneCount} of ${state.tasks.length} missions completed.`;

      const activeTask = state.activeTaskId ? getTaskById(state.activeTaskId) : null;
      $('timerMessage').textContent = activeTask
        ? `Active task: ${activeTask.text}`
        : 'Ready when you are.';
    }

    function renderStats() {
      const level = Math.floor(state.xp / 50) + 1;
      const currentProgress = state.xp % 50;
      $('xp').textContent = String(state.xp);
      $('level').textContent = `Level ${level} · ${['Frog beginner', 'Study tadpole', 'Academic amphibian', 'Legendary frog'][Math.min(level - 1, 3)]}`;
      $('bar').style.width = `${(currentProgress / 50) * 100}%`;
      $('xpProgress').setAttribute('aria-valuenow', String(currentProgress));
      $('reward').textContent = level >= 2 ? '🎩 Your frog earned a tiny graduation hat!' : `${50 - currentProgress} XP until your first reward!`;
      $('frog').textContent = state.tasks.some(task => task.done) ? '🐸' : '🐸';
    }

    function renderAll() {
      renderTasks();
      renderStats();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(state.timer / 60);
      const secs = state.timer % 60;
      $('timer').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      $('timer').setAttribute('aria-label', `${mins} minutes and ${secs} seconds remaining`);
    }

    function startTimer() {
      if (state.timerId) return;
      state.timerId = setInterval(() => {
        state.timer -= 1;
        updateTimerDisplay();
        if (state.timer <= 0) {
          clearInterval(state.timerId);
          state.timerId = null;
          $('timerMessage').textContent = 'Session complete! Take a little break. 🎉';
          state.xp += 20;
          saveState();
          renderStats();
          state.timer = 25 * 60;
          updateTimerDisplay();
        }
      }, 1000);
    }

    function pauseTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      $('timerMessage').textContent = 'Paused. Take your time.';
    }

    function resetTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      state.timer = 25 * 60;
      updateTimerDisplay();
      $('timerMessage').textContent = 'Timer reset. Ready when you are.';
    }

    $('taskForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const text = $('taskInput').value.trim();
      const duration = Number($('taskDuration').value) || 25;
      const priority = formatPriority($('taskPriority').value);

      if (!text) return;

      state.tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        text,
        duration,
        priority,
        done: false
      });

      $('taskInput').value = '';
      $('taskInput').focus();
      saveState();
      renderAll();
    });

    $('start').addEventListener('click', startTimer);
    $('pause').addEventListener('click', pauseTimer);
    $('reset').addEventListener('click', resetTimer);
    $('switchTask').addEventListener('click', () => {
      const activeTask = state.tasks.find(task => !task.done);
      if (!activeTask) {
        $('timerMessage').textContent = 'No active mission to use.';
        return;
      }
      state.activeTaskId = activeTask.id;
      $('timerMessage').textContent = `Active task: ${activeTask.text}`;
      saveState();
      renderTasks();
    });

    loadState();
    updateTimerDisplay();
    renderAll();
  </script>
</body>
</html>
